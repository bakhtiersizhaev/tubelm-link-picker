<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TubeLM Link Picker copies selected YouTube video and Shorts URLs for NotebookLM, AI notes, and research workflows.">
  <title>TubeLM Link Picker</title>
  <link rel="icon" href="../icons/icon-32.png" type="image/png">
  <link rel="stylesheet" href="popup.css">
</head>
<body data-mode="popup">
  <main class="frame" aria-labelledby="appTitle">
    <header class="top">
      <div class="brand">
        <img class="logo" src="../icons/icon-48.png" width="40" height="40" alt="" aria-hidden="true">
        <div class="brand-text">
          <h1 class="name" id="appTitle" data-i18n="appName">TubeLM</h1>
          <p class="tag" data-i18n="appTagline">YouTube links for NotebookLM</p>
        </div>
      </div>
      <span class="status" id="tabStatus" data-intent="neutral" aria-live="polite" data-i18n="statusChecking">Checking…</span>
    </header>

    <section class="metric" aria-live="polite">
      <div class="metric-stat">
        <p class="label" data-i18n="labelSelected">Selected</p>
        <p class="value" id="statCount" data-zero="true">0</p>
      </div>
      <p class="note" id="statNote" data-i18n="noteEmpty">Tick videos on the page, or use Select visible to grab a row at a time.</p>
    </section>

    <button id="copySelectedBtn" class="btn btn-primary" type="button" disabled>
      <span class="btn-label" id="copyLabel" data-i18n="copyLabelEmpty">Copy selection</span>
      <span class="btn-hint" id="copyHint" data-i18n="copyHintDefault">Newline list, ready for NotebookLM</span>
    </button>

    <div class="actions">
      <button id="selectAllBtn" class="btn btn-ghost" type="button" data-i18n="selectVisibleButton">Select visible</button>
      <button id="clearBtn" class="btn btn-ghost is-subtle" type="button" data-i18n="clearButton">Clear</button>
    </div>

    <section class="about" aria-label="About TubeLM">
      <p class="thanks" data-i18n="thanksLine">Thanks for using TubeLM.</p>
      <p class="credits">
        <span data-i18n="creditsPrefix">By</span>
        <a href="https://github.com/bakhtiersizhaev" target="_blank" rel="noopener noreferrer">Bakhtier Sizhaev</a>
        <span class="sep" aria-hidden="true">·</span>
        <a class="star-link" href="https://github.com/bakhtiersizhaev/tubelm-link-picker" target="_blank" rel="noopener noreferrer">
          <span class="star" aria-hidden="true">★</span><span data-i18n="linkGitHub">GitHub</span>
        </a>
        <span class="sep" aria-hidden="true">·</span>
        <a href="https://telelore.vercel.app/" target="_blank" rel="noopener noreferrer">TeleLore</a>
      </p>
      <button id="openSidePanelBtn" class="btn btn-panel" type="button" hidden>
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false">
          <rect x="1.5" y="2.5" width="13" height="11" rx="2" stroke="currentColor" stroke-width="1.4"/>
          <path d="M10 2.5 V 13.5" stroke="currentColor" stroke-width="1.4"/>
        </svg>
        <span data-i18n="openSidePanel">Open in side panel</span>
      </button>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
